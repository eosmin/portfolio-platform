name: api

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  # A push to main must finish; only superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/api

jobs:
  quality:
    name: api-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm turbo run lint typecheck build --filter=@portfolio/api

  # Unit and integration run apart so a failure names its layer. Each uploads a blob report with
  # coverage; the coverage job merges them and enforces the gate once.
  unit:
    runs-on: ubuntu-latest
    env:
      COVERAGE_PARTIAL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: >-
          pnpm turbo run test:unit --filter=@portfolio/api --
          --coverage --reporter=default --reporter=blob --outputFile.blob=.vitest/blob/blob-unit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-unit
          path: apps/api/.vitest/blob
          include-hidden-files: true

  # Testcontainers needs Docker, which ubuntu-latest provides.
  integration:
    runs-on: ubuntu-latest
    env:
      COVERAGE_PARTIAL: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: >-
          pnpm turbo run test:integration --filter=@portfolio/api --
          --coverage --reporter=default --reporter=blob --outputFile.blob=.vitest/blob/blob-integration.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-integration
          path: apps/api/.vitest/blob
          include-hidden-files: true

  # The threshold counts unit and integration together, so it is enforced on the merged reports.
  coverage:
    needs: [unit, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-*
          path: apps/api/.vitest/blob
          merge-multiple: true
      - run: pnpm --filter @portfolio/api exec vitest --merge-reports --coverage

  # Builds once, scans that image, and pushes the very same image to GHCR only from main.
  image:
    needs: [quality, coverage]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          load: true
          tags: portfolio-api:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: portfolio-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the scanned image
        if: github.ref == 'refs/heads/main'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag portfolio-api:ci "$tag"
            docker push "$tag"
          done
