name: repo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: repo-${{ github.ref }}
  # A push to main must finish; only superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The squash merge uses the PR title as the commit message, and no local hook sees it.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | pnpm exec commitlint
      # GitHub appends " (#N)" on squash and commitlint caps the header at 100.
      - name: Title leaves room for the squash suffix
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          length=${#PR_TITLE}
          test "$length" -le 90 || { echo "PR title is $length characters; the limit is 90"; exit 1; }

  gitleaks:
    # A title or description edit changes no code, so it does not need a new scan.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --silent --show-error --fail --location --remote-name \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "$archive" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan history
        run: gitleaks git --redact --no-banner --verbose
