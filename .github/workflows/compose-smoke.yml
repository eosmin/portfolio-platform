name: compose-smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: compose-smoke-${{ github.ref }}
  # A push to main must finish; only superseded PR runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create .env from the example
        run: cp .env.example .env
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 600
      - name: GET /healthz
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:4000/healthz)
          test "$status" = 200 || { echo "/healthz returned $status"; exit 1; }
      - name: GET /v1/projects
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:4000/v1/projects)
          test "$status" = 200 || { echo "/v1/projects returned $status"; exit 1; }
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
