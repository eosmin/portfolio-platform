services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.2
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    restart: unless-stopped
    env_file: .env
    environment:
      # The .env values point at localhost (api on the host); inside the network the services are reachable by name.
      NODE_ENV: development
      API_PORT: 4000
      # CORS must allow the origin the browser really uses, so it follows the published site port.
      CORS_ORIGIN: http://localhost:${SITE_PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-portfolio}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-portfolio}
      REDIS_URL: redis://redis:6379
    ports:
      - '${API_PORT:-4000}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The slim image has no curl; Node 24 ships fetch.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  site:
    build:
      context: .
      dockerfile: apps/site/Dockerfile
    restart: unless-stopped
    # No env_file: the site gets only what it reads, never the api's secrets (JWT, admin hash, database URL).
    environment:
      # `next build` runs when this container starts (see apps/site/Dockerfile), so the browser URL below
      # is inlined at that moment. It follows the published api port; server-side reads use the internal name.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-4000}/v1
      API_BASE_URL: http://api:4000/v1
      SITE_API_KEY: ${SITE_API_KEY:?set SITE_API_KEY in .env}
      IMAGE_HOSTS: ${IMAGE_HOSTS:-placehold.co}
      SITE_PORT: 3000
      # .env says development (for the api); next build fails with it ("useContext" of null while prerendering).
      NODE_ENV: production
    ports:
      - '${SITE_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Healthy only after the start-up `next build` finished and `next start` answers.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

volumes:
  postgres-data:
